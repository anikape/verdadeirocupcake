<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Verdadeiro Cupcake</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff8fb;
      color: #222;
    }

    header {
      background: #e91e63;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    header .acoes-topo {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-sec {
      background: #fff;
      color: #e91e63;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 20px;
    }

    .lista, .form-box {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .lista h2, .form-box h2 {
      margin-top: 0;
    }

    .subtitulo {
      margin-top: 18px;
    }

    .produto-item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .produto-item:hover,
    .produto-item.ativo {
      border-color: #e91e63;
      background: #fff3f8;
    }

    .produto-item h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .produto-item p {
      margin: 0;
      font-size: 0.9rem;
      color: #555;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    label {
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .acoes-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-salvar {
      background: #2e7d32;
      color: white;
    }

    .btn-novo {
      background: #1565c0;
      color: white;
      margin-bottom: 10px;
    }

    .btn-excluir {
      background: #c62828;
      color: white;
    }

    .status {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #2e7d32;
      white-space: pre-line;
    }

    .hint {
      font-size: 0.84rem;
      color: #666;
      margin-top: -4px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Painel Administrativo</h1>
    <div class="acoes-topo">
      <button class="btn-sec" id="btnIrSite" type="button">Ver site</button>
      <button class="btn-sec" id="btnLogout" type="button">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="lista">
      <h2>Produtos</h2>
      <button class="btn-novo" id="btnNovoProduto" type="button">Novo produto</button>
      <div id="listaProdutos"></div>

      <h2 class="subtitulo">Páginas</h2>
      <button class="btn-novo" id="btnNovaPagina" type="button">Nova página</button>
      <div id="listaPaginas"></div>
    </section>

    <section class="form-box">
      <h2 id="tituloFormulario">Editar item</h2>

      <form id="itemForm" class="grid">
        <input type="hidden" id="docId" />
        <input type="hidden" id="tipoItem" value="product" />

        <div>
          <label for="nome">Nome / Título</label>
          <input type="text" id="nome" required />
        </div>

        <div>
          <label for="descricao">Descrição</label>
          <textarea id="descricao"></textarea>
        </div>

        <div id="blocoPrecos">
          <label for="precos">Preços / Sabores</label>
          <textarea id="precos" placeholder="Uma linha por item"></textarea>
        </div>

        <div id="blocoCategorias">
          <label for="categorias">Categorias</label>
          <textarea id="categorias" placeholder="Use linhas em branco para separar blocos"></textarea>
        </div>

        <div id="blocoImagemProduto">
          <label for="imagem">Imagem (URL)</label>
          <input type="text" id="imagem" placeholder="https://..." />
        </div>

        <div id="blocoImagensPagina" class="oculto">
          <label for="imagensPagina">Imagens da página</label>
          <textarea id="imagensPagina" placeholder="Uma URL por linha"></textarea>
          <p class="hint">Cole uma imagem por linha.</p>
        </div>

        <div id="blocoLinkProduto">
          <label for="link">Link do botão “Mais Informações”</label>
          <input type="text" id="link" placeholder="ex: kits.html" />
        </div>

        <div id="blocoBotaoVoltar" class="oculto">
          <label for="botaoVoltarLink">Link do botão voltar</label>
          <input type="text" id="botaoVoltarLink" placeholder="ex: index.html" />
        </div>

        <div class="acoes-form">
          <button class="btn-salvar" type="submit">Salvar</button>
          <button class="btn-excluir" type="button" id="btnExcluir">Excluir</button>
        </div>

        <p class="status" id="status"></p>
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCi2vM_4utdQ0k1ZIXwi_qvbLi0Rbuf_Qs",
      authDomain: "verdadeiro-cupcake.firebaseapp.com",
      projectId: "verdadeiro-cupcake",
      storageBucket: "verdadeiro-cupcake.firebasestorage.app",
      messagingSenderId: "102388121619",
      appId: "1:102388121619:web:522188edfc65dfd511ffe6",
      measurementId: "G-01HDV2DESK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const listaProdutos = document.getElementById("listaProdutos");
    const listaPaginas = document.getElementById("listaPaginas");
    const itemForm = document.getElementById("itemForm");
    const statusEl = document.getElementById("status");
    const tituloFormulario = document.getElementById("tituloFormulario");

    const docIdEl = document.getElementById("docId");
    const tipoItemEl = document.getElementById("tipoItem");
    const nomeEl = document.getElementById("nome");
    const descricaoEl = document.getElementById("descricao");
    const precosEl = document.getElementById("precos");
    const categoriasEl = document.getElementById("categorias");
    const imagemEl = document.getElementById("imagem");
    const imagensPaginaEl = document.getElementById("imagensPagina");
    const linkEl = document.getElementById("link");
    const botaoVoltarLinkEl = document.getElementById("botaoVoltarLink");

    const blocoPrecos = document.getElementById("blocoPrecos");
    const blocoCategorias = document.getElementById("blocoCategorias");
    const blocoImagemProduto = document.getElementById("blocoImagemProduto");
    const blocoImagensPagina = document.getElementById("blocoImagensPagina");
    const blocoLinkProduto = document.getElementById("blocoLinkProduto");
    const blocoBotaoVoltar = document.getElementById("blocoBotaoVoltar");

    const btnNovoProduto = document.getElementById("btnNovoProduto");
    const btnNovaPagina = document.getElementById("btnNovaPagina");
    const btnExcluir = document.getElementById("btnExcluir");
    const btnLogout = document.getElementById("btnLogout");
    const btnIrSite = document.getElementById("btnIrSite");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        inicializarPainel();
      }
    });

    async function inicializarPainel() {
      await carregarProdutos();
      await carregarPaginas();
      prepararFormularioProduto();
    }

    btnIrSite.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    btnLogout.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    btnNovoProduto.addEventListener("click", () => {
      prepararFormularioProduto();
      limparFormulario();
      statusEl.textContent = "Novo produto.";
    });

    btnNovaPagina.addEventListener("click", () => {
      prepararFormularioPagina();
      limparFormulario();
      statusEl.textContent = "Nova página. Use no campo Nome / Título algo como: acetato, kits, lembrancinhas.";
    });

    btnExcluir.addEventListener("click", async () => {
      const id = docIdEl.value;
      const tipo = tipoItemEl.value;

      if (!id) {
        statusEl.textContent = "Selecione um item para excluir.";
        return;
      }

      const ok = confirm("Deseja excluir este item?");
      if (!ok) return;

      try {
        if (tipo === "product") {
          await deleteDoc(doc(db, "products", id));
          await carregarProdutos();
        } else {
          await deleteDoc(doc(db, "pages", id));
          await carregarPaginas();
        }

        limparFormulario();
        statusEl.textContent = "Item excluído com sucesso.";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Erro ao excluir item.";
      }
    });

    itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const tipo = tipoItemEl.value;
      const id = docIdEl.value.trim();

      try {
        if (tipo === "product") {
          const dadosProduto = {
            nome: nomeEl.value.trim(),
            descricao: descricaoEl.value.trim(),
            precos: precosEl.value.trim(),
            categorias: categoriasEl.value.trim(),
            imagem: imagemEl.value.trim(),
            link: linkEl.value.trim()
          };

          if (id) {
            await updateDoc(doc(db, "products", id), dadosProduto);
            statusEl.textContent = "Produto atualizado com sucesso.";
          } else {
            await addDoc(collection(db, "products"), dadosProduto);
            statusEl.textContent = "Produto criado com sucesso.";
            limparFormulario();
          }

          await carregarProdutos();
        } else {
          const idPagina = id || nomeEl.value.trim().toLowerCase().replace(/\s+/g, "-");
          const imagensArray = imagensPaginaEl.value
            .split("\n")
            .map((linha) => linha.trim())
            .filter(Boolean);

          const dadosPagina = {
            titulo: nomeEl.value.trim(),
            descricao: descricaoEl.value.trim(),
            imagens: imagensArray,
            botaoVoltarLink: botaoVoltarLinkEl.value.trim() || "index.html"
          };

          await setDoc(doc(db, "pages", idPagina), dadosPagina);
          docIdEl.value = idPagina;
          statusEl.textContent = "Página salva com sucesso.";
          await carregarPaginas();
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Erro ao salvar item.";
      }
    });

    async function carregarProdutos() {
      listaProdutos.innerHTML = "Carregando...";
      const querySnapshot = await getDocs(collection(db, "products"));

      const itens = [];
      querySnapshot.forEach((item) => {
        itens.push({ id: item.id, ...item.data() });
      });

      itens.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));

      if (!itens.length) {
        listaProdutos.innerHTML = "<p>Nenhum produto cadastrado.</p>";
        return;
      }

      listaProdutos.innerHTML = itens.map((produto) => `
        <div class="produto-item" data-id="${produto.id}">
          <h3>${produto.nome || "Sem nome"}</h3>
          <p>${produto.descricao || ""}</p>
        </div>
      `).join("");

      document.querySelectorAll("#listaProdutos .produto-item").forEach((el) => {
        el.addEventListener("click", async () => {
          marcarAtivo(el);
          await carregarProduto(el.dataset.id);
        });
      });
    }

    async function carregarPaginas() {
      listaPaginas.innerHTML = "Carregando...";
      const querySnapshot = await getDocs(collection(db, "pages"));

      const itens = [];
      querySnapshot.forEach((item) => {
        itens.push({ id: item.id, ...item.data() });
      });

      itens.sort((a, b) => (a.titulo || a.id || "").localeCompare(b.titulo || b.id || ""));

      if (!itens.length) {
        listaPaginas.innerHTML = "<p>Nenhuma página cadastrada.</p>";
        return;
      }

      listaPaginas.innerHTML = itens.map((pagina) => `
        <div class="produto-item" data-id="${pagina.id}">
          <h3>${pagina.titulo || pagina.id}</h3>
          <p>ID: ${pagina.id}</p>
        </div>
      `).join("");

      document.querySelectorAll("#listaPaginas .produto-item").forEach((el) => {
        el.addEventListener("click", async () => {
          marcarAtivo(el);
          await carregarPagina(el.dataset.id);
        });
      });
    }

    async function carregarProduto(id) {
      prepararFormularioProduto();

      const refDoc = doc(db, "products", id);
      const snap = await getDoc(refDoc);

      if (!snap.exists()) return;

      const produto = snap.data();

      docIdEl.value = id;
      tipoItemEl.value = "product";
      nomeEl.value = produto.nome || "";
      descricaoEl.value = produto.descricao || "";
      precosEl.value = produto.precos || "";
      categoriasEl.value = produto.categorias || "";
      imagemEl.value = produto.imagem || "";
      linkEl.value = produto.link || "";
      statusEl.textContent = "Produto carregado.";
    }

    async function carregarPagina(id) {
      prepararFormularioPagina();

      const refDoc = doc(db, "pages", id);
      const snap = await getDoc(refDoc);

      if (!snap.exists()) return;

      const data = snap.data();

      docIdEl.value = id;
      tipoItemEl.value = "page";
      nomeEl.value = data.titulo || "";
      descricaoEl.value = data.descricao || "";
      imagensPaginaEl.value = (data.imagens || []).join("\n");
      botaoVoltarLinkEl.value = data.botaoVoltarLink || "index.html";
      statusEl.textContent = "Página carregada.";
    }

    function prepararFormularioProduto() {
      tipoItemEl.value = "product";
      tituloFormulario.textContent = "Editar produto";

      blocoPrecos.classList.remove("oculto");
      blocoCategorias.classList.remove("oculto");
      blocoImagemProduto.classList.remove("oculto");
      blocoLinkProduto.classList.remove("oculto");

      blocoImagensPagina.classList.add("oculto");
      blocoBotaoVoltar.classList.add("oculto");
    }

    function prepararFormularioPagina() {
      tipoItemEl.value = "page";
      tituloFormulario.textContent = "Editar página";

      blocoPrecos.classList.add("oculto");
      blocoCategorias.classList.add("oculto");
      blocoImagemProduto.classList.add("oculto");
      blocoLinkProduto.classList.add("oculto");

      blocoImagensPagina.classList.remove("oculto");
      blocoBotaoVoltar.classList.remove("oculto");
    }

    function limparFormulario() {
      docIdEl.value = "";
      nomeEl.value = "";
      descricaoEl.value = "";
      precosEl.value = "";
      categoriasEl.value = "";
      imagemEl.value = "";
      imagensPaginaEl.value = "";
      linkEl.value = "";
      botaoVoltarLinkEl.value = "";
      document.querySelectorAll(".produto-item").forEach((x) => x.classList.remove("ativo"));
    }

    function marcarAtivo(elemento) {
      document.querySelectorAll(".produto-item").forEach((x) => x.classList.remove("ativo"));
      elemento.classList.add("ativo");
    }
  </script>
</body>
</html>
